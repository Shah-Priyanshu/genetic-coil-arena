; R18 desk bench: one firmware for every ESP32-S3 board, driven over USB serial by
; scripts/r18_bench.py. Build with PLATFORMIO_CORE_DIR=D:/platformio (toolchains on D:).
[env:bench]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -I.. -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = adafruit/Adafruit SGP40 Sensor@^1.1.3
